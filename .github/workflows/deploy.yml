name: CI / Deploy to GitHub Pages

permissions:
  contents: write
  pages: write

on:
  push:
    branches: [ simple-version ]
  pull_request:
    branches: [ simple-version ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build / Lint / Typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set VITE_BASE env for build
        # For project pages we compute the base from repo name; for other branches
        # this will still work and produce "/<repo>/" which is safe for CI builds.
        run: echo "VITE_BASE=/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: "Debug: list dist before upload"
        run: echo "---- dist content ----" && ls -la dist || true

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/simple-version' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: .

      - name: "Debug: list downloaded files"
        run: ls -la && echo "--- dist contents ---" && ls -la dist || true

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
